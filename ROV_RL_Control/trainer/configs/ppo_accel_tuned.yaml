env:
  dt: 0.02
  max_power: 60.0
  window_size: 9
  accel_filter_alpha: 0.5
reward:
  k_pos: 1.0
  k_att: 0.5
  k_vel: 0.1
  k_jerk: 0.01
  k_eng: 0.001
  k_succ: 5.0
  pos_tol: 0.1
sampling:
  n_envs: 4
  batch_size: 1024
ppo:
  learning_rate:
    type: linear
    initial_lr: 0.0001
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.0
  vf_coef: 0.5
  clip_range: 0.12
  clip_range_vf: 0.12
  max_grad_norm: 0.5
  n_epochs: 8
train:
  total_timesteps: 500000
  seed: 42
