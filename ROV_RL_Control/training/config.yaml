hyperparameters:
  max_episodes: 500
  max_steps_per_episode: 1000
  replay_buffer_size: 1000000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  explore_noise: 0.1
  eval_interval: 20
  save_interval: 50
  sac:
    lr: 0.0003
    automatic_entropy_tuning: true
    target_entropy: -8
    use_value_net: true
    log_std_min: -20
    log_std_max: 2
  td3:
    actor_lr: 0.0003
    critic_lr: 0.0003
    policy_noise: 0.2
    noise_clip: 0.5
    policy_freq: 2
  ddpg:
    actor_lr: 0.0001
    critic_lr: 0.001
    noise_std: 0.1
    noise_clip: 0.2
